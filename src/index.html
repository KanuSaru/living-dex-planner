<meta property="og:title" content="Living Dex Planner">
<meta property="og:description" content="Every route, level, encounter rate, evolution and form in the Gen 4 Pokémon games, ordered into the quickest living dex route.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#e7e9ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13121b" media="(prefers-color-scheme: dark)">

<body>
<header class="top"><div class="top-in" id="top-in"><div class="brand"><div class="brand-text"><h1>Living Dex <span>Planner</span></h1></div></div></div></header>
<div class="wrap" id="wrap">

</div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sync" hidden></div>

</footer>
