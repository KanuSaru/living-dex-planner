# Builds the data from PokéAPI, runs every test and data check, and publishes site/ to GitHub Pages.
# Pull requests only build and test. A monthly run picks up PokéAPI data fixes.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pillow
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: living-dex-offline
          path: dist/living-dex.html
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
